<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비버챌린지 응시코드 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    min-height: 100vh;
    background: #102a43;   /* 포스터와 같은 남색 */
    color: #1d2733;
    overflow-x: hidden;
  }
  /* 반짝이 장식 (포스터의 십자 별) */
  .spark { position: fixed; width: 34px; height: 34px; opacity: .85; z-index: 0; pointer-events: none; }
  .spark::before, .spark::after { content: ""; position: absolute; background: #fff; border-radius: 2px; }
  .spark::before { left: 16px; top: 0; width: 2px; height: 34px; }
  .spark::after { top: 16px; left: 0; height: 2px; width: 34px; }
  .s1 { top: 70px; left: 7%; } .s2 { top: 42%; right: 6%; } .s3 { bottom: 12%; left: 5%; transform: scale(.7); }

  main {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto; padding: 22px 18px 50px;
    display: flex; flex-direction: column; align-items: center;
  }
  .top { width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .title-wrap { padding-bottom: 18px; }
  .year { color: #fff; font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }
  .brand { color: #8ee85a; font-size: 2.3rem; font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
  .eng { color: #fff; font-size: .78rem; letter-spacing: 1px; margin-top: 6px; opacity: .9; }
  .beaver { width: 190px; max-width: 48%; height: auto; display: block; }

  /* 브라우저 창 모양 카드 */
  .card {
    width: 100%; background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .bar { background: #dcdcdc; padding: 12px 16px; display: flex; gap: 8px; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #d0404c; } .bar i:nth-child(2) { background: #e2b93b; } .bar i:nth-child(3) { background: #5aa548; }
  .body { padding: 24px 22px 24px; }
  h1 {
    display: block; width: fit-content; margin: 0 auto;
    font-size: 1.2rem; font-weight: 900; color: #102a43;
    background: #8ee85a; border: 2.5px solid #102a43; border-radius: 999px; padding: 7px 22px;
  }
  .sub { text-align: center; font-size: .95rem; color: #55606c; margin: 12px 0 14px; }

  label { display: block; font-weight: 700; font-size: 1rem; margin: 14px 0 6px; }
  input {
    width: 100%; font-size: 1.15rem; padding: 13px 15px;
    border: 2px solid #d5dbe2; border-radius: 12px; outline: none; background: #fff;
  }
  input:focus { border-color: #102a43; box-shadow: 0 0 0 3px rgba(142,232,90,.5); }
  .hint { font-size: .85rem; color: #7b8692; margin-top: 4px; }

  .btn {
    display: block; width: 100%; margin-top: 22px; padding: 15px;
    font-size: 1.1rem; font-weight: 800; color: #fff; cursor: pointer;
    background: #102a43; border: none; border-radius: 12px; transition: background .15s;
  }
  .btn:hover { background: #1c3d5e; }
  .btn:active { transform: translateY(1px); }

  .error {
    display: none; margin-top: 16px; padding: 12px 14px; border-radius: 10px;
    background: #fdecec; color: #c0392b; font-weight: 600; font-size: .95rem; text-align: center;
  }

  /* 결과 */
  .result { display: none; margin-top: 18px; }
  .hello { text-align: center; font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; color: #102a43; }
  .row { border: 2px solid #e3e8ee; border-radius: 14px; padding: 13px 15px; margin-bottom: 12px; }
  .row .name { font-size: .88rem; color: #55606c; font-weight: 700; }
  .row .line { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .code {
    flex: 1; font-family: "Consolas", "Menlo", monospace; font-size: clamp(1rem, 4.6vw, 1.3rem); font-weight: 700;
    letter-spacing: .5px; word-break: break-all; color: #102a43;
  }
  .copy {
    flex-shrink: 0; padding: 10px 14px; font-size: .98rem; font-weight: 800; cursor: pointer;
    border: 2px solid #102a43; border-radius: 10px; background: #8ee85a; color: #102a43;
  }
  .copy:active { transform: translateY(1px); }
  .copy.done { background: #102a43; color: #fff; }
  .msg { height: 1.2em; margin-top: 6px; font-size: .9rem; font-weight: 700; color: #2f8a2a; opacity: 0; transition: opacity .2s; }
  .msg.show { opacity: 1; }

  .go {
    display: block; text-align: center; margin-top: 8px; padding: 14px;
    border-radius: 12px; background: #102a43; color: #8ee85a; text-decoration: none;
    font-weight: 800; font-size: 1.05rem;
  }
  .again { display: block; margin: 14px auto 0; background: none; border: none; color: #55606c; text-decoration: underline; font-size: .95rem; cursor: pointer; }
  footer { margin-top: 18px; font-size: .8rem; color: #9fb3c8; text-align: center; }
</style>
</head>

    <div class="body">

    <form id="form" autocomplete="off">

7d8": ["26drhztp50098", "894651"], "d3c2b408": ["26drhztp50099", "397511"], "690d7bce": ["26drhztp50100", "569512"], "9bd301ba": ["26drhztp50101", "220243"], "c968f41d": ["26drhztp50102", "571374"], "e98cccc4": ["26drhztp50104", "169212"], "ff3973f1": ["26drhztp50105", "210739"]};

  // FNV-1a 32비트 해시 (UTF-8 기준) — 자료를 만든 파이썬 코드와 같은 방식
  function hash(str) {
    const bytes = new TextEncoder().encode(str);
    let h = 0x811c9dc5;
    for (const b of bytes) {
      h ^= b;
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, "0");
  }

  const $ = (id) => document.getElementById(id);

  // 조회하기
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const no = $("no").value.replace(/\D/g, "");
    const name = $("name").value.replace(/\s/g, "");
    const err = $("error");

    if (no.length !== 5) return showError("학번 5자리를 입력해 주세요. (예: 20101)");
    if (!name) return showError("이름을 입력해 주세요.");

    const found = CODES[hash(no + "|" + name)];
    if (!found) return showError("학번이나 이름이 맞지 않아요. 다시 확인하고, 그래도 안 되면 선생님께 말해 주세요.");

    err.style.display = "none";
    $("cid").textContent = found[0];
    $("cpw").textContent = found[1];
    $("hello").textContent = `${name} 학생의 응시코드예요 🎉`;
    $("form").style.display = "none";
    $("result").style.display = "block";
  });

  function showError(text) {
    const err = $("error");
    err.textContent = text;
    err.style.display = "block";
  }

  // 복사하기 버튼
  document.querySelectorAll(".copy").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const text = $(btn.dataset.target).textContent;
      const ok = await copyText(text);
      const msg = $("msg-" + btn.dataset.target);
      msg.textContent = ok ? `✅ ${btn.dataset.label} 복사됨` : "복사가 안 됐어요. 직접 길게 눌러 복사해 주세요.";
      msg.classList.add("show");
      btn.classList.add("done");
      btn.textContent = "✔ 복사됨";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => {
        msg.classList.remove("show");
        btn.classList.remove("done");
        btn.textContent = "📋 복사하기";
      }, 2500);
    });
  });

  // 클립보드 복사 (https가 아닌 환경을 위한 예비 방법 포함)
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  // 다시 조회
  $("again").addEventListener("click", () => {
    $("result").style.display = "none";
    $("form").style.display = "block";
    $("no").value = ""; $("name").value = "";
    $("no").focus();
  });
</script>
